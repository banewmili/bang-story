appId: id.bangtutorial.bangstory
productName: Bang Story
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/ffmpeg-static/{README.md,example.js,install.js,ffmpeg.exe.README}'
extraResources:
  - from: resources/fonts
    to: fonts
  # Copied by scripts/copy-ffmpeg-license.mjs before packaging: the ffmpeg-static
  # LICENSE file is named ffmpeg.exe.LICENSE on Windows and ffmpeg.LICENSE elsewhere.
  - from: build/FFmpeg-LICENSE.txt
    to: licenses/FFmpeg-LICENSE.txt
  - from: resources/licenses
    to: licenses
  # Staged by scripts/prepare-dist.mjs: only the whisper.cpp binaries for the
  # platform being packaged (Windows: whisper-cli.exe + DLLs; macOS: whisper-cli
  # if one was placed in resources/whisper, otherwise empty and the app uses PATH).
  - from: build/stage/whisper
    to: whisper
asarUnpack:
  - node_modules/ffmpeg-static/**
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: BangStory-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Bang Story
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: BangStory-${version}-mac-${arch}.${ext}
  category: public.app-category.video
  darkModeSupport: true
npmRebuild: true
